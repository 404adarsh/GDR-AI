<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="iconCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Background Squircle (Dark Glass) -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#0B0E14" stroke="#00F2FE" stroke-opacity="0.25" stroke-width="1.5" />

  <g transform="translate(64, 64) scale(0.78)">
    <!-- Top Cube -->
    <g transform="translate(0, -45)">
      <path d="M0,-25 L22,-12 L0,0 L-22,-12 Z" fill="#00F2FE" filter="url(#iconGlow)" />
      <path d="M-22,-12 L0,0 L0,25 L-22,13 Z" fill="#00C6FF" />
      <path d="M0,0 L22,-12 L22,13 L0,25 Z" fill="#0072FF" />
    </g>

    <!-- Left Cube -->
    <g transform="translate(-26, 0)">
      <path d="M0,-25 L22,-12 L0,0 L-22,-12 Z" fill="#1F2937" stroke="#00F2FE" stroke-width="1.8" />
      <path d="M-22,-12 L0,0 L0,25 L-22,13 Z" fill="#111827" stroke="#00F2FE" stroke-width="1.8" />
      <path d="M0,0 L22,-12 L22,13 L0,25 Z" fill="#0D1117" stroke="#00F2FE" stroke-width="1.8" />
    </g>

    <!-- Right Cube -->
    <g transform="translate(26, 0)">
      <path d="M0,-25 L22,-12 L0,0 L-22,-12 Z" fill="#1F2937" stroke="#00F2FE" stroke-width="1.8" />
      <path d="M-22,-12 L0,0 L0,25 L-22,13 Z" fill="#0D1117" stroke="#00F2FE" stroke-width="1.8" />
      <path d="M0,0 L22,-12 L22,13 L0,25 Z" fill="#111827" stroke="#00F2FE" stroke-width="1.8" />
    </g>

    <!-- Bottom Center Glowing Cube -->
    <g transform="translate(0, 45)">
      <path d="M0,-25 L22,-12 L0,0 L-22,-12 Z" fill="#00F2FE" filter="url(#iconGlow)" />
      <path d="M-22,-12 L0,0 L0,25 L-22,13 Z" fill="#00C6FF" />
      <path d="M0,0 L22,-12 L22,13 L0,25 Z" fill="#0072FF" />
    </g>
  </g>
</svg>
