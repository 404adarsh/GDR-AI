name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libportaudio2 portaudio19-dev

      - name: Install Python Package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Syntax & Compilation Validation
        run: |
          python -m compileall gdr/

      - name: Security Scan for Leaked Secrets
        run: |
          # Verify no .env files, private keys or plaintext secret tokens are checked in
          ! git ls-files | grep -E '\.(env|key|pem|sqlite|db)$'
          ! git grep -E 'sk_[a-zA-Z0-9]{20,}' gdr/

      - name: Run Test Suite
        run: |
          pytest tests/test_bots_rag_sarvam_and_vad.py -v

